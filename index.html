<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Builder</title>
    <style>
      :root {
        color: #172033;
        background: #eef2ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      .app-loading {
        display: grid;
        min-height: 100vh;
        place-items: center;
      }

      .static-dashboard {
        display: grid;
        gap: 1.25rem;
        margin: 0 auto;
        max-width: 1180px;
        min-height: 100vh;
        padding: 2rem;
      }

      .static-dashboard__hero,
      .static-dashboard__panel,
      .static-dashboard__card {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(79, 70, 229, 0.13);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(36, 48, 89, 0.12);
        padding: clamp(1.5rem, 4vw, 2.5rem);
      }

      .static-dashboard__hero {
        background: radial-gradient(circle at top right, rgba(79, 70, 229, 0.22), transparent 32rem), white;
      }

      .static-dashboard h1,
      .static-dashboard h2,
      .static-dashboard h3,
      .static-dashboard p {
        margin-top: 0;
      }

      .static-dashboard h1 {
        font-size: clamp(2.5rem, 7vw, 5.5rem);
        letter-spacing: -0.08em;
        line-height: 0.92;
        margin-bottom: 1rem;
      }

      .static-dashboard h2 {
        font-size: clamp(1.75rem, 4vw, 3rem);
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .static-dashboard__eyebrow {
        color: #4f46e5;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        margin-bottom: 0.75rem;
        text-transform: uppercase;
      }

      .static-dashboard__copy,
      .static-dashboard__summary {
        color: #64748b;
        line-height: 1.6;
      }

      .static-dashboard__toolbar {
        display: grid;
        gap: 1rem;
        grid-template-columns: minmax(220px, 1fr) auto;
        margin: 1.5rem 0;
      }

      .static-dashboard input {
        background: #f8faff;
        border: 1px solid #dbe3ef;
        border-radius: 16px;
        color: #172033;
        font: inherit;
        padding: 0.9rem 1rem;
      }

      .static-dashboard button {
        background: #4f46e5;
        border: 0;
        border-radius: 16px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        padding: 0.9rem 1rem;
      }

      .static-dashboard button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }

      .static-dashboard__grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      }

      .static-dashboard__card {
        box-shadow: none;
      }

      .static-dashboard__meta {
        color: #4f46e5;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .static-dashboard__skills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .static-dashboard__skills span {
        background: #eef2ff;
        border-radius: 999px;
        color: #4f46e5;
        font-size: 0.82rem;
        font-weight: 800;
        padding: 0.4rem 0.65rem;
      }

      @media (max-width: 720px) {
        .static-dashboard {
          padding: 1rem;
        }

        .static-dashboard__toolbar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="app-loading">Loading Resume Builder…</div></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      window.setTimeout(function renderStaticFallback() {
        var root = document.getElementById('root');
        if (!root || !root.querySelector('.app-loading')) {
          return;
        }

        var maxResumes = 10;
        var storageKey = 'resume-builder:saved-resumes';
        var viewKey = 'resume-builder:dashboard-view-mode';
        var starterResumes = [
          {
            id: 'resume-product-designer',
            name: 'Product Designer Resume',
            templateId: 'modern',
            createdAt: '2026-04-18T10:30:00.000Z',
            updatedAt: '2026-05-08T15:20:00.000Z',
            pageSize: 'A4',
            resumeData: {
              role: 'Senior Product Designer',
              summary: 'Turns customer research into polished product experiences and measurable business outcomes.',
              skills: ['UX strategy', 'Design systems', 'Prototyping', 'User research'],
            },
          },
          {
            id: 'resume-frontend-engineer',
            name: 'Frontend Engineer Resume',
            templateId: 'classic',
            createdAt: '2026-03-24T08:15:00.000Z',
            updatedAt: '2026-05-05T19:45:00.000Z',
            pageSize: 'Letter',
            resumeData: {
              role: 'Frontend Engineer',
              summary: 'Builds accessible React interfaces with a focus on performance, design fidelity, and maintainability.',
              skills: ['React', 'TypeScript', 'Accessibility', 'Testing'],
            },
          },
        ];

        function readResumes() {
          try {
            var stored = window.localStorage.getItem(storageKey);
            var parsed = stored ? JSON.parse(stored) : starterResumes;
            return Array.isArray(parsed) ? parsed.slice(0, maxResumes) : starterResumes;
          } catch (error) {
            return starterResumes;
          }
        }

        function writeResumes(resumes) {
          try {
            window.localStorage.setItem(storageKey, JSON.stringify(resumes));
          } catch (error) {}
        }

        function createResume(resumes) {
          var timestamp = new Date().toISOString();
          return [{
            id: 'resume-' + Date.now(),
            name: 'Untitled Resume ' + (resumes.length + 1),
            templateId: 'modern',
            createdAt: timestamp,
            updatedAt: timestamp,
            pageSize: 'A4',
            resumeData: { role: '', summary: '', skills: [] },
          }].concat(resumes);
        }

        function escapeHtml(value) {
          return String(value).replace(/[&<>\"']/g, function (character) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;' }[character];
          });
        }

        function paint() {
          var resumes = readResumes();
          var search = '';
          var viewMode = 'grid';
          try {
            viewMode = window.localStorage.getItem(viewKey) === 'list' ? 'list' : 'grid';
          } catch (error) {}

          root.innerHTML = '<main class="static-dashboard">'
            + '<section class="static-dashboard__hero"><p class="static-dashboard__eyebrow">Resume Builder</p><h1>Build, customize, and export your next resume.</h1><p class="static-dashboard__copy">Manage saved resumes, search drafts, and keep application-ready versions organized.</p></section>'
            + '<section class="static-dashboard__panel"><div><p class="static-dashboard__eyebrow">Resume dashboard</p><h2>Manage saved resumes.</h2><p class="static-dashboard__copy">Search, create, and review up to ' + maxResumes + ' saved resumes.</p></div>'
            + '<div class="static-dashboard__toolbar"><input id="static-resume-search" type="search" placeholder="Search by name..." aria-label="Search resumes by name"><button id="static-create-resume" type="button">Create resume</button></div>'
            + '<div class="static-dashboard__grid" id="static-resume-grid"></div></section></main>';

          var grid = document.getElementById('static-resume-grid');
          var searchInput = document.getElementById('static-resume-search');
          var createButton = document.getElementById('static-create-resume');

          function drawCards() {
            var filtered = resumes.filter(function (resume) {
              return resume.name.toLowerCase().indexOf(search.toLowerCase()) !== -1;
            });
            grid.style.gridTemplateColumns = viewMode === 'list' ? '1fr' : 'repeat(auto-fit, minmax(250px, 1fr))';
            grid.innerHTML = filtered.map(function (resume) {
              var skills = (resume.resumeData.skills || []).slice(0, 3).map(function (skill) {
                return '<span>' + escapeHtml(skill) + '</span>';
              }).join('') || '<span>No skills yet</span>';
              return '<article class="static-dashboard__card"><p class="static-dashboard__meta">' + escapeHtml(resume.templateId) + ' • ' + escapeHtml(resume.pageSize) + '</p><h3>' + escapeHtml(resume.name) + '</h3><p><strong>' + escapeHtml(resume.resumeData.role || 'Role not set') + '</strong></p><p class="static-dashboard__summary">' + escapeHtml(resume.resumeData.summary || 'Add a summary to make this resume easier to identify later.') + '</p><div class="static-dashboard__skills">' + skills + '</div></article>';
            }).join('') || '<p class="static-dashboard__copy">No resumes match your search.</p>';
            createButton.disabled = resumes.length >= maxResumes;
            createButton.textContent = resumes.length >= maxResumes ? 'Resume limit reached' : 'Create resume';
          }

          searchInput.addEventListener('input', function (event) {
            search = event.target.value;
            drawCards();
          });
          createButton.addEventListener('click', function () {
            if (resumes.length >= maxResumes) {
              return;
            }
            resumes = createResume(resumes);
            writeResumes(resumes);
            drawCards();
          });
          drawCards();
        }

        paint();
      }, 600);
    </script>
  </body>
</html>
